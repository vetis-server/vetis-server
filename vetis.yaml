worker_threads: 12
max_blocking_threads: 6

server:
  workers: 1
  log:
    dest: "stdout"
    log_level: $(VETIS_LOG_LEVEL:"INFO")
  hosts:
    - hostname: "localhost"
      root_directory: "sites/default"
      enable_hsts: false
      allow_unsafe_conn: false
      bind_addresses:
        - ["0.0.0.0", 8443]
      protos:
        - "HTTP/2.0"
      log:
        dest: "stdout"
        log_level: "INFO"
      tls:
        ca_file: "certs/ca.der"
        cert_file: "certs/server.der"
        key_file: "certs/server.key.der"
        #supported_alpns:
        #  - "h2"
      status_pages:
        404: "404.html"
      paths:
        - type: "static_path"
          uri: "/"
          directory: "html"
          extensions: "\\.(html|ico|css)$"
          cache:
            max_file_size: 10485760
            ttl: "5m"
            tti: "2m"
            capacity: 1000
          index_files:
            - "index.html"
        - type: "flash_path"
          uri: "/vetis"
          response: "Hello from VeTiS!"
          status_code: 200
        - type: "flash_path"
          uri: "/vetis/rio"
          response: "Fala galera!"
          status_code: 200
