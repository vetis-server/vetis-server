[package]
name = "vetis-server"
version = "0.1.0-beta.2"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
edition = "2024"
repository = "https://github.com/vetis-server/vetis-server"
homepage = "https://github.com/vetis-server/vetis"
description = "Very Tiny Server"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "networking", "tokio", "web-server"]
publish = true
rust-version = "1.86.0"

[package.metadata.wix]
upgrade-guid = "CC7ED56C-7541-44AC-A5CB-4AD7CEFF7796"
path-guid = "B9DD4049-AB78-4A22-9F1B-1567DB281490"
license = false
eula = false

[features]
default = ["yaml-config", "logging", "flash", "static"]

# Config files support
yaml-config = ["dep:serde-saphyr"]
toml-config = ["dep:toml"]

logging = ["dep:vetis-log", "dep:logforth"]
metrics = ["dep:vetis-otel"]

# Script support
rhai-script = ["dep:vetis-rhai"]

# Misc modules
flash = ["dep:vetis-flash"]
proxy = ["dep:vetis-proxy"]
rev-proxy = ["dep:vetis-rev-proxy"]
static = ["dep:vetis-static"]

[dependencies]
clap = { version = "4.6.10", default-features = false, features = [
  "derive",
  "help",
  "std",
  "usage"
] }
log = "0.4.34"
logforth = { version = "0.30.1", optional = true, features = ["starter-log"] }
mimalloc = "0.1.52"
regex = "1.13.2"
serde = "1.0.228"
serde-saphyr = { version = "2.2.0", optional = true }
toml = { version = "1.1.6", optional = true }
tokio = { version = "1.54.1", features = [
  "fs",
  "signal",
  "net",
  "macros",
  "rt-multi-thread",
  "windows-sys",
], default-features = false }
vetis = { path = "../vetis/vetis", default-features = false }
vetis-flash = { path = "../vetis-flash", optional = true, features = [
  "runtime-tokio",
] }
vetis-log = { path = "../vetis-log", optional = true }
vetis-otel = { path = "../vetis-otel", optional = true }
vetis-proxy = { path = "../vetis-proxy", optional = true, features = [
  "runtime-tokio",
] }
vetis-rev-proxy = { path = "../vetis-rev-proxy", optional = true, features = [
  "runtime-tokio",
] }
vetis-rhai = { path = "../vetis-rhai", optional = true, features = [
  "runtime-tokio",
] }
vetis-static = { path = "../vetis-static", optional = true, features = [
  "runtime-tokio",
] }
vetis-tokio = { path = "../vetis-tokio" }

[dev-dependencies]
assert_cmd = "2.2.2"
caramelo = "0.1.5"
deboa = { version = "0.1.5" }
deboa-tokio = { version = "0.1.4", default-features = false, features = [
  "http2",
  #"http3",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
] }
predicates = "3.1.4"
tokio = { version = "1.54.1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

