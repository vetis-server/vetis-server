[package]
name = "vetis-server"
version = "0.1.0-beta.1"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
edition = "2024"
repository = "https://github.com/vetis-server/vetis-tokio"
homepage = "https://github.com/vetis-server/vetis"
description = "Very Tiny Server"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "networking", "tokio", "web-server"]
publish = true
rust-version = "1.85.0"

[package.metadata.wix]
upgrade-guid = "CC7ED56C-7541-44AC-A5CB-4AD7CEFF7796"
path-guid = "B9DD4049-AB78-4A22-9F1B-1567DB281490"
license = false
eula = false

[features]
default = ["yaml-config", "logging", "static", "flash"]

# Config files support
yaml-config = ["dep:serde_yaml_ng"]
toml-config = ["dep:toml"]

logging = ["dep:vetis-log", "dep:logforth"]
metrics = ["dep:vetis-otel"]

# Script support
rhai-script = ["dep:vetis-rhai"]

# Misc modules
flash = ["dep:vetis-flash"]
proxy = ["dep:vetis-proxy"]
rev-proxy = ["dep:vetis-rev-proxy"]
static = ["dep:vetis-static"]

[dependencies]
clap = { version = "4.6.7", default-features = false, features = [
  "std",
  "derive",
] }
log = "0.4.34"
logforth = { version = "0.30.1", optional = true, features = ["starter-log"] }
mimalloc = "0.1.52"
regex = "1.13.1"
serde = "1.0.228"
serde_yaml_ng = { version = "0.10.0", optional = true }
sysinfo = { version = "0.39.6", optional = true }
toml = { version = "1.1.6", optional = true }
tokio = { version = "1.53.1", features = [
  "fs",
  "signal",
  "net",
  "macros",
  "rt-multi-thread",
  "windows-sys",
], default-features = false }
vetis = { version = "0.1.7-beta.5", default-features = false }
vetis-flash = { version = "0.1.0-beta.1", optional = true, features = [
  "runtime-tokio",
] }
vetis-log = { version = "0.1.0-beta.1", optional = true }
vetis-otel = { version = "0.1.0-beta.1", optional = true }
vetis-proxy = { version = "0.1.2-beta.1", optional = true, features = [
  "runtime-tokio",
] }
vetis-rhai = { version = "0.1.0-beta.1", optional = true, features = [
  "runtime-tokio",
] }
vetis-rev-proxy = { version = "0.1.0-beta.1", optional = true, features = [
  "runtime-tokio",
] }
vetis-static = { version = "0.1.1-beta.2", optional = true, features = [
  "runtime-tokio",
] }
vetis-tokio = { version = "0.1.2-beta.6" }

[dev-dependencies]
caramelo = "0.1.5"
deboa = { version = "0.1.5-beta.3" }
deboa-tokio = { version = "0.1.4-beta.3", default-features = false, features = [
  "http2",
  #"http3",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
] }
tokio = { version = "1.53.2", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
